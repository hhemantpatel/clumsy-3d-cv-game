[package]
name = "game_engine_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Hemant"]
description = "High-performance Rust WASM physics, particle simulation, and character kinematics engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
